<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
  <title id="title">偏振片与四分之一波片</title>
  <desc id="desc">左图表示线偏振光通过检偏器后振幅投影并服从马吕斯定律，右图表示四分之一波片给正交分量加入四分之一周期相位差形成圆或椭圆偏振。</desc>
  <defs>
    <style>
      .axis{stroke:#334155;stroke-width:2.5;fill:none}
      .blue{stroke:#2563eb;stroke-width:5;fill:none}
      .orange{stroke:#ea580c;stroke-width:4;fill:none}
      .plate{fill:#dbeafe;stroke:#2563eb;stroke-width:2}
      .title{font:700 24px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#0f172a;text-anchor:middle}
      .text{font:18px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#334155;text-anchor:middle}
    </style>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/></marker>
  </defs>
  <text class="title" x="270" y="40">检偏器只保留透振方向的投影</text>
  <circle cx="270" cy="245" r="145" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <path class="axis" d="M110 245H430"/><path class="axis" d="M270 85V405"/>
  <path class="blue" d="M270 245L386 143" marker-end="url(#blue-arrow)"/><path class="orange" d="M270 245L386 245" marker-end="url(#orange-arrow)"/>
  <path d="M322 245 A52 52 0 0 0 309 207" stroke="#64748b" stroke-width="2" fill="none"/>
  <text class="text" x="332" y="221">θ</text><text class="text" x="270" y="445">I=I₀ cos²θ</text>
  <path d="M550 55V440" stroke="#cbd5e1" stroke-width="2"/>
  <text class="title" x="825" y="40">四分之一波片：正交分量相差 π/2</text>
  <path class="axis" d="M610 250H1045"/>
  <rect class="plate" x="730" y="92" width="82" height="315"/><text class="text" x="771" y="75">λ/4 波片</text>
  <path class="blue" d="M620 250 C642 155,664 345,686 250 C708 155,720 218,730 250"/>
  <path class="orange" d="M812 250 C835 155,858 345,881 250 C904 155,927 345,950 250"/>
  <ellipse cx="1005" cy="250" rx="42" ry="85" fill="none" stroke="#16a34a" stroke-width="4"/>
  <text class="text" x="1005" y="367">等幅时为圆偏振</text>
</svg>
