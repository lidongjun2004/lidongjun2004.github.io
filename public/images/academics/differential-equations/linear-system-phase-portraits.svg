<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title desc">
  <title id="title">二维线性系统的典型相图</title>
  <desc id="desc">特征值的实部和符号决定稳定结点、不稳定结点、鞍点和螺旋汇等典型相图。</desc>
  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L7 3 z" fill="#2563eb"/></marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L0 6 L7 3 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1040" height="580" rx="28" fill="#f8fafc"/>
  <text x="54" y="58" font-size="29" font-family="system-ui, sans-serif" font-weight="700" fill="#172033">二维常系数系统：特征值决定原点附近的基本形状</text>
  <g transform="translate(62 100)">
    <rect width="210" height="355" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
    <text x="30" y="39" font-size="23" font-family="system-ui, sans-serif" font-weight="700" fill="#1e3a8a">稳定结点</text>
    <line x1="105" y1="72" x2="105" y2="276" stroke="#94a3b8"/><line x1="25" y1="174" x2="185" y2="174" stroke="#94a3b8"/>
    <path d="M35 90 Q65 128 101 168" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
    <path d="M175 92 Q145 129 109 168" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
    <path d="M38 260 Q69 220 101 180" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
    <path d="M172 259 Q141 220 109 180" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
    <circle cx="105" cy="174" r="6" fill="#172033"/>
    <text x="29" y="314" font-size="18" font-family="system-ui, sans-serif" fill="#334155">两个实特征值均负</text>
    <text x="43" y="339" font-size="18" font-family="system-ui, sans-serif" fill="#334155">轨线流向原点</text>
  </g>
  <g transform="translate(298 100)">
    <rect width="210" height="355" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
    <text x="43" y="39" font-size="23" font-family="system-ui, sans-serif" font-weight="700" fill="#9a3412">鞍点</text>
    <line x1="105" y1="72" x2="105" y2="276" stroke="#94a3b8"/><line x1="25" y1="174" x2="185" y2="174" stroke="#94a3b8"/>
    <path d="M105 84 L105 165" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
    <path d="M105 264 L105 183" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
    <path d="M105 174 C138 145 158 113 181 88" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
    <path d="M105 174 C72 203 51 235 29 260" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
    <circle cx="105" cy="174" r="6" fill="#172033"/>
    <text x="37" y="314" font-size="18" font-family="system-ui, sans-serif" fill="#334155">两个实特征值异号</text>
    <text x="35" y="339" font-size="18" font-family="system-ui, sans-serif" fill="#334155">一方向进，一方向出</text>
  </g>
  <g transform="translate(534 100)">
    <rect width="210" height="355" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="3"/>
    <text x="34" y="39" font-size="23" font-family="system-ui, sans-serif" font-weight="700" fill="#166534">螺旋汇</text>
    <line x1="105" y1="72" x2="105" y2="276" stroke="#94a3b8"/><line x1="25" y1="174" x2="185" y2="174" stroke="#94a3b8"/>
    <path d="M176 113 C183 216 72 259 42 178 C19 117 96 82 140 119 C174 148 142 208 100 204 C68 201 62 159 88 145 C108 134 129 155 119 175" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#b)"/>
    <circle cx="105" cy="174" r="6" fill="#172033"/>
    <text x="25" y="314" font-size="18" font-family="system-ui, sans-serif" fill="#334155">复根实部为负</text>
    <text x="34" y="339" font-size="18" font-family="system-ui, sans-serif" fill="#334155">旋转并收缩到原点</text>
  </g>
  <g transform="translate(770 100)">
    <rect width="210" height="355" rx="20" fill="#fef2f2" stroke="#fca5a5" stroke-width="3"/>
    <text x="25" y="39" font-size="23" font-family="system-ui, sans-serif" font-weight="700" fill="#991b1b">不稳定结点</text>
    <line x1="105" y1="72" x2="105" y2="276" stroke="#94a3b8"/><line x1="25" y1="174" x2="185" y2="174" stroke="#94a3b8"/>
    <path d="M101 168 Q65 128 35 90" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
    <path d="M109 168 Q145 129 175 92" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
    <path d="M101 180 Q69 220 38 260" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
    <path d="M109 180 Q141 220 172 259" fill="none" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
    <circle cx="105" cy="174" r="6" fill="#172033"/>
    <text x="29" y="314" font-size="18" font-family="system-ui, sans-serif" fill="#334155">两个实特征值均正</text>
    <text x="43" y="339" font-size="18" font-family="system-ui, sans-serif" fill="#334155">轨线离开原点</text>
  </g>
  <text x="62" y="515" font-size="20" font-family="system-ui, sans-serif" fill="#475569">特征值给出稳定性与形状；螺旋的顺逆时针仍需把一个测试点代入向量场判断。</text>
</svg>
