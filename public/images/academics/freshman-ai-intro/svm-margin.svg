<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">支持向量机最大间隔示意图</title>
  <desc id="desc">两类样本、分类超平面、两条间隔边界和支持向量</desc>
  <rect width="960" height="440" rx="28" fill="#f8fafc"/>
  <g stroke-linecap="round">
    <line x1="302" y1="402" x2="690" y2="34" stroke="#94a3b8" stroke-width="3" stroke-dasharray="12 11"/>
    <line x1="391" y1="410" x2="779" y2="42" stroke="#0f172a" stroke-width="6"/>
    <line x1="480" y1="418" x2="868" y2="50" stroke="#94a3b8" stroke-width="3" stroke-dasharray="12 11"/>
    <path d="M381 266l92 97" stroke="#9333ea" stroke-width="3"/>
    <path d="M384 264l-4 17m4-17l-17 3M474 363l-17 4m17-4l-4-17" stroke="#9333ea" stroke-width="3"/>
  </g>
  <g fill="#2563eb" stroke="#1e3a8a" stroke-width="3">
    <circle cx="195" cy="270" r="13"/><circle cx="225" cy="325" r="13"/><circle cx="278" cy="282" r="13"/>
    <circle cx="315" cy="345" r="13"/><circle cx="347" cy="250" r="13"/><circle cx="407" cy="299" r="16" fill="#fff"/>
  </g>
  <g fill="#f97316" stroke="#9a3412" stroke-width="3">
    <circle cx="570" cy="139" r="16" fill="#fff"/><circle cx="630" cy="171" r="13"/><circle cx="681" cy="112" r="13"/>
    <circle cx="716" cy="195" r="13"/><circle cx="768" cy="126" r="13"/><circle cx="824" cy="176" r="13"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" fill="#334155">
    <text x="540" y="385" font-size="23" font-weight="700">决策边界：w·x + b = 0</text>
    <text x="380" y="226" font-size="23" font-weight="700" fill="#7e22ce">间隔 2/‖w‖</text>
    <text x="92" y="86" font-size="24">离边界最近的样本决定间隔，</text>
    <text x="92" y="119" font-size="24">它们就是支持向量（空心点）。</text>
  </g>
</svg>
