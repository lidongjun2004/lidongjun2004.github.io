<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Q-learning 八状态导航图</title>
  <desc id="desc">A 到 H 八个状态构成导航图，D 是终点，C 到 D 的有向转移奖励为一百</desc>
  <rect width="1040" height="520" rx="28" fill="#f8fafc"/>
  <defs>
    <marker id="reward-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
  </defs>
  <g stroke="#64748b" stroke-width="8" stroke-linecap="round">
    <path d="M365 135 L580 135"/>
    <path d="M150 390 L365 390"/><path d="M365 390 L580 390"/><path d="M580 390 L825 390"/>
    <path d="M150 135 L150 390"/><path d="M365 135 L365 390"/><path d="M580 135 L580 390"/>
  </g>
  <path d="M640 135 L750 135" stroke="#dc2626" stroke-width="10" stroke-linecap="round" marker-end="url(#reward-arrow)"/>
  <g font-family="sans-serif" font-size="38" font-weight="700" text-anchor="middle">
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="5">
      <circle cx="150" cy="135" r="58"/><circle cx="365" cy="135" r="58"/><circle cx="580" cy="135" r="58"/>
      <circle cx="150" cy="390" r="58"/><circle cx="365" cy="390" r="58"/><circle cx="580" cy="390" r="58"/><circle cx="825" cy="390" r="58"/>
    </g>
    <circle cx="825" cy="135" r="65" fill="#dcfce7" stroke="#16a34a" stroke-width="7"/>
    <g fill="#1e3a8a"><text x="150" y="148">A</text><text x="365" y="148">B</text><text x="580" y="148">C</text><text x="150" y="403">E</text><text x="365" y="403">F</text><text x="580" y="403">G</text><text x="825" y="403">H</text></g>
    <text x="825" y="148" fill="#14532d">D</text>
  </g>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155">
    <text x="703" y="96" font-size="24" font-weight="700">奖励 100</text>
    <text x="520" y="485" font-size="23">其余合法转移奖励为 0；无连接动作奖励为 −1</text>
  </g>
</svg>
